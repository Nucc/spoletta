services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    volumes:
      - mysql-data:/var/lib/mysql
    # Published on the host's loopback only, for the e2e tests and a webapp
    # run outside compose. With another MySQL on 127.0.0.1:3306 already, set
    # MYSQL_PUBLISH=[::1]:3306 in .env, and TEST_DB_ADDR to the same.
    ports:
      - "${MYSQL_PUBLISH:-127.0.0.1:3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs pi agent harnesses for agent processes, and bash for script
  # processes. Only the webapp reaches it, so its port isn't published. It
  # uses the models and model settings from your pi config (PI_CONFIG_DIR,
  # ~/.pi/agent by default), never its keys: agents reach their models
  # through the webapp, which has the keys. Restart it after changing it.
  worker:
    # Built from the top, since the image takes the guide in docs/ too.
    build:
      context: .
      dockerfile: worker/Containerfile
    environment:
      - PORT=8090
      # The token only the webapp asks the worker with, the same in both;
      # without one the worker answers anyone reaching it, and runs their
      # bash. Make one with `openssl rand -hex 32` and set it in .env. Or
      # mount a file and name it in WORKER_TOKEN_FILE, in both.
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      # Where steps run: process, as the worker's own processes, which see
      # what the worker sees; for a container per step, which sees only
      # its own, run with compose.sandbox.yaml too. See docs/SANDBOX.md.
      - SANDBOX=process
      - STEPS_DIR=/data/steps
      - PI_SKIP_VERSION_CHECK=1
      - PI_TELEMETRY=0
      # Bedrock without a key signs in with AWS credentials: pass AWS_* here
      # for it, which only pi gets. Model keys go to the webapp, below.
      # Steps get only the variables they need from the worker's
      # environment, never its secrets. To hand every script (and agent)
      # more, such as a token for curl -H "Authorization: Bearer
      # $JIRA_API_TOKEN", name them here, comma-separated, and pass each
      # through, such as `- JIRA_API_TOKEN`; agents can read them then.
      - CHILD_ENV=${CHILD_ENV:-}
    volumes:
      # Only these two files: the agent can read anything mounted, and the
      # rest of the directory holds sessions and OAuth tokens.
      - ${PI_CONFIG_DIR:-~/.pi/agent}/models.json:/pi-host/models.json:ro
      - ${PI_CONFIG_DIR:-~/.pi/agent}/settings.json:/pi-host/settings.json:ro
      # Files runs generate, at the same path as in the webapp, which serves them.
      - files:/data/files
      # The runs' git checkouts, kept between their steps.
      - workspaces:/data/workspaces
      # Steps' private directories, which steps in containers of their own
      # are given parts of; see compose.sandbox.yaml.
      - steps:/data/steps
    restart: unless-stopped

  webapp:
    build: ./webapp
    environment:
      # Where the database is, unless config/database.yaml, mounted below,
      # says otherwise; its environments can read these too. APP_ENV picks
      # one (development by default); see webapp/database.go.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-app}
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      PORT: "8080"
      # Inside the container; the port is published below.
      HOST: 0.0.0.0
      WORKER_URL: http://worker:8090
      # The worker's token; see the worker's.
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      # For flows with repositories: each step working on them gets a token
      # for them, handed to its git and nothing else. With a GitHub App
      # installed on the repositories (contents: read and write), a token
      # of the app's, for the run's repositories only, lasting an hour:
      # its ID, its installation's ID, and its private key, or a file
      # holding it named by GITHUB_APP_PRIVATE_KEY_FILE; GITHUB_API_URL for
      # GitHub Enterprise. Otherwise GIT_TOKEN, such as a GitHub token with
      # contents:read, handed to every step as it is, which isn't
      # short-lived; GIT_USERNAME defaults to x-access-token, which GitHub
      # takes. See webapp/git_tokens.go.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_USERNAME: ${GIT_USERNAME:-}
      # Where the worker reaches the proxies agents use their models and MCP
      # servers through.
      PROXY_URL: http://webapp:8080
      # Model keys, passed through from the host when set: what the models
      # of your pi config read (its models.json may name others; add them),
      # and those the model providers added in the settings read when kept
      # in a vault. The webapp reaches the providers with them for agents,
      # which never see them; a key saved in the settings goes over these.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Signing in over OpenID Connect with your identity provider, with
      # Google, or with either; without OIDC_ISSUER or GOOGLE_CLIENT_ID
      # nobody signs in and anyone reaching the webapp can do anything.
      # Register http://localhost:8080/api/auth/callback, or PUBLIC_URL's,
      # as each client's redirect URI; for Google, a web application's
      # OAuth client in the Google Cloud console. OIDC_NAME names your
      # provider on the page asking which to sign in with. Only people in
      # ADMIN_EMAILS, at a domain in OIDC_ALLOWED_DOMAINS, or added by an
      # admin sign in; all comma-separated. Google is taken at its word
      # only for Gmail addresses and for accounts of the Google Workspace at
      # the email's domain, as anyone can make a Google account with any
      # email. See webapp/users.go.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Seals the model keys and MCP tokens the webapp keeps in the
      # database; make one with `openssl rand -base64 32`, and keep it, as
      # the webapp doesn't start without the key it sealed them with. See
      # webapp/secrets.go. SECRET_KEY_SECONDARY is the key coming in while
      # rotating it; see docs/SECRETS.md. The webapp also takes either from
      # a file, named by SECRET_KEY_FILE or SECRET_KEY_SECONDARY_FILE, to
      # add here with the file mounted.
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_SECONDARY: ${SECRET_KEY_SECONDARY:-}
    volumes:
      # Read-only: the webapp checks and serves files; the worker writes them.
      - files:/data/files:ro
      # config/database.yaml, when made from config/database.yaml.example,
      # read again whenever the webapp connects.
      - ./config:/config:ro
    # Published on the host's loopback only, since while nobody signs in
    # anyone reaching the webapp can do anything, running bash on the worker
    # included. Once people sign in, set PUBLISH_HOST=0.0.0.0 in .env to
    # reach it from other machines.
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  files:
  workspaces:
  steps:
