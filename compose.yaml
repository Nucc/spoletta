services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs pi agent harnesses for agent processes, and bash for script
  # processes. Only the webapp reaches it, so its port isn't published. It
  # uses the models and model settings from your pi config (PI_CONFIG_DIR,
  # ~/.pi/agent by default) and credentials from the environment `podman
  # compose up` runs in; restart it after changing either.
  worker:
    # Built from the top, since the image takes the guide in docs/ too.
    build:
      context: .
      dockerfile: worker/Containerfile
    environment:
      - PORT=8090
      - PI_SKIP_VERSION_CHECK=1
      - PI_TELEMETRY=0
      # Passed through from the host when set. Add any other variables your
      # models.json references.
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      # For script processes calling APIs, e.g. curl -H "Authorization:
      # Bearer $SENTRY_AUTH_TOKEN". Agents can read them too.
      - SENTRY_AUTH_TOKEN
      - SENTRY_URL
      - JIRA_URL
      - JIRA_EMAIL
      - JIRA_API_TOKEN
      # For flows with repositories: a token that can clone them over https,
      # such as a GitHub token with contents:read. Agents can read it too.
      # GIT_USERNAME defaults to x-access-token, which GitHub takes. Set
      # here rather than passed through, so a .env file next to this one
      # works too: podman-compose reads .env only for ${...}.
      - GIT_TOKEN=${GIT_TOKEN:-}
      - GIT_USERNAME=${GIT_USERNAME:-}
    volumes:
      # Only these two files: the agent can read anything mounted, and the
      # rest of the directory holds sessions and OAuth tokens.
      - ${PI_CONFIG_DIR:-~/.pi/agent}/models.json:/pi-host/models.json:ro
      - ${PI_CONFIG_DIR:-~/.pi/agent}/settings.json:/pi-host/settings.json:ro
      # Files runs generate, at the same path as in the webapp, which serves them.
      - files:/data/files
      # The runs' git checkouts, kept between their steps.
      - workspaces:/data/workspaces
    restart: unless-stopped

  webapp:
    build: ./webapp
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-app}
      DB_USER: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      PORT: "8080"
      WORKER_URL: http://worker:8090
      # Where the worker reaches the proxy agents use MCP servers through.
      MCP_PROXY_URL: http://webapp:8080
      # For Sentry processes: a token with event:read, and the address of a
      # self-hosted Sentry if not sentry.io.
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_URL: ${SENTRY_URL:-}
    volumes:
      # Read-only: the webapp checks and serves files; the worker writes them.
      - files:/data/files:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  files:
  workspaces:
